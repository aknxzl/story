<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Chapters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto+Slab">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!--
    CHAPTERS
    Each chapter is one button below. To add a new one: copy the Chapter One button,
    change the words, and point href at that chapter's home page.
    The locked "To be continued" button is just a placeholder; delete it whenever.
  -->
  <header class="logo-wrap">
    <h1 class="logo">
      <span class="logo-script">Our Chapters</span>
    </h1>
    <div class="logo-divider" aria-hidden="true">
      <span></span><svg viewBox="0 0 24 22"><path d="M12 21s-9-5.6-9-12A5 5 0 0 1 12 6a5 5 0 0 1 9 3c0 6.4-9 12-9 12z"/></svg><span></span>
    </div>
  </header>

  <main>
    <nav class="menu" aria-label="Chapters">
      <a class="btn" href="index.html" data-transition>Chapter One</a>
      <span class="btn is-locked" aria-disabled="true">
        <svg class="chapter-lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/><circle cx="12" cy="15.5" r="1.3"/></svg>
        To be continued
      </span>
    </nav>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
