<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto+Slab">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="logo-wrap">
    <h1 class="logo">
      <span class="logo-script">Welcome</span>
    </h1>
    <div class="logo-divider" aria-hidden="true">
      <span></span><svg viewBox="0 0 24 22"><path d="M12 21s-9-5.6-9-12A5 5 0 0 1 12 6a5 5 0 0 1 9 3c0 6.4-9 12-9 12z"/></svg><span></span>
    </div>
  </header>

  <main>
    <article class="page-card">
      <form class="login-form" data-login novalidate>
        <label>
          Username
          <input name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="login-error" role="alert"></p>
        <button class="btn" type="submit">Enter</button>
      </form>
    </article>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
