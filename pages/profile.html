<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto+Slab">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- Made from the story.html template; see the notes at the top of that file -->
  <header class="logo-wrap">
    <h1 class="logo">
      <span class="logo-script">Our Matching Profiles</span>
    </h1>
    <div class="logo-divider" aria-hidden="true">
      <span></span><svg viewBox="0 0 24 22"><path d="M12 21s-9-5.6-9-12A5 5 0 0 1 12 6a5 5 0 0 1 9 3c0 6.4-9 12-9 12z"/></svg><span></span>
    </div>
  </header>

  <main class="page-main">
    <article class="page-card">
      <h2 class="gallery-month" aria-live="polite"></h2>
      <div class="gallery" data-gallery
           data-photos="../images/profile"
           data-per-slide="2"
           data-label="Matching Profile" data-slides="5">
        <button class="gallery-arrow" data-dir="-1" aria-label="Previous slide">&#8249;</button>
        <div class="gallery-track"></div>
        <button class="gallery-arrow" data-dir="1" aria-label="Next slide">&#8250;</button>
      </div>
    </article>
    <nav class="page-nav" data-story-nav>
      <a class="btn" href="../index.html" data-back data-transition>Back</a>
      <a class="btn" href="../index.html" data-next data-transition>Next</a>
    </nav>
  </main>

  <script src="../js/script.js"></script>
</body>
</html>
